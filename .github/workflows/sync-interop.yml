name: Swift-Windows-Sync-Interop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interop:
    name: Drei echte Peers (Swift A/B + Windows)
    runs-on: macos-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Swift-Sync-Harness bauen
        run: bash scripts/build-sync-harness.sh

      - name: Drei-Peer-Interop testen
        run: node scripts/test-swift-windows-interop.js

  ios-build:
    name: iOS-App-Target bauen
    runs-on: macos-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Xcode-Version
        run: xcodebuild -version

      - name: iOS-Build
        run: >-
          xcodebuild -quiet -project Toolbox.xcodeproj -scheme Toolbox
          -configuration Debug -destination 'generic/platform=iOS'
          -derivedDataPath build/xcode-ios-ci CODE_SIGNING_ALLOWED=NO build
