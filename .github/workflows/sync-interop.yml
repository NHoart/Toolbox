name: Swift-Windows-Sync-Interop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interop:
    name: Drei echte Peers (Swift A/B + Windows)
    runs-on: macos-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Swift-Sync-Harness bauen
        run: bash scripts/build-sync-harness.sh

      - name: Drei-Peer-Interop testen
        run: node scripts/test-swift-windows-interop.js

  ios-build:
    name: iOS-App-Target bauen
    # macos-latest hat derzeit Xcode 26.6 und kann das neue project.xcproj
    # (Xcode 27) nicht öffnen. Der xcode-27-Runner wird auch für die DMG genutzt.
    runs-on: xcode-27
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Neueste installierte Xcode-Version auswählen
        run: |
          set -euo pipefail
          latest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$latest" ]; then
            sudo xcode-select -s "$latest"
          fi
          xcodebuild -version

      - name: iOS-Build
        run: >-
          xcodebuild -quiet -project Toolbox.xcodeproj -scheme Toolbox
          -configuration Debug -destination 'generic/platform=iOS'
          -derivedDataPath build/xcode-ios-ci CODE_SIGNING_ALLOWED=NO build
