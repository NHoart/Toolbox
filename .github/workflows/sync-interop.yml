name: Swift-Windows sync interop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interop:
    name: Three real peers (Swift A/B + Windows)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Swift sync harness
        run: bash scripts/build-sync-harness.sh

      - name: Test three-peer interop
        run: node scripts/test-swift-windows-interop.js

  ios-build:
    name: Build iOS app target
    # macos-latest currently ships Xcode 26.6 and cannot open the new
    # project.xcproj format (Xcode 27). The xcode-27 runner is also used for the DMG.
    runs-on: xcode-27
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select the newest installed Xcode version
        run: |
          set -euo pipefail
          latest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$latest" ]; then
            sudo xcode-select -s "$latest"
          fi
          xcodebuild -version

      - name: iOS build
        run: >-
          xcodebuild -quiet -project Toolbox.xcodeproj -scheme Toolbox
          -configuration Debug -destination 'generic/platform=iOS'
          -derivedDataPath build/xcode-ios-ci CODE_SIGNING_ALLOWED=NO build
