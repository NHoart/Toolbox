name: Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "EXE als GitHub-Release veröffentlichen"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Windows-Installer bauen
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests
        run: npm test

      - name: Headless-Sync-Smoke-Test
        run: npm run smoke:sync

      - name: Installer bauen
        run: npm run dist -- --publish never

      - name: Installer als Workflow-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Toolbox-windows
          path: windows/dist/Toolbox-Setup.exe
          if-no-files-found: error

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version

          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = "v$version"
          }

          # Die Download-Tabelle steht ganz oben in den Release-Notes; dafür
          # Repository und Tag in die Vorlage einsetzen.
          $repo = $env:GITHUB_REPOSITORY
          if (-not $repo) {
            $repo = (gh repo view --json nameWithOwner --jq .nameWithOwner)
          }
          $notesTemplate = Join-Path $env:GITHUB_WORKSPACE ".github/windows-release-notes.md"
          $notes = Join-Path $env:RUNNER_TEMP "windows-release-notes.md"
          (Get-Content $notesTemplate -Raw).Replace('{{REPO}}', $repo).Replace('{{TAG}}', $tag) |
            Set-Content -Path $notes -Encoding utf8

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            # Falls der macOS-Workflow denselben Release gleichzeitig anlegt,
            # ist ein Fehlschlag hier in Ordnung – das Hochladen versucht es erneut.
            gh release create $tag --title "Toolbox $version" --notes-file $notes
            Start-Sleep -Seconds 2
          }

          # latest.yml und die Blockmap braucht electron-updater für Auto-Updates.
          $assets = @(
            "dist/Toolbox-Setup.exe",
            "dist/Toolbox-Setup.exe.blockmap",
            "dist/latest.yml"
          )

          for ($attempt = 1; $attempt -le 5; $attempt++) {
            gh release upload $tag $assets --clobber
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 5) { exit 1 }
            Start-Sleep -Seconds 4
          }

      - name: Release-Assets prüfen
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version

          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = "v$version"
          }

          for ($attempt = 1; $attempt -le 90; $attempt++) {
            $names = @(gh release view $tag --json assets --jq '.assets[] | select(.state == "uploaded") | .name' 2>$null)
            if ($names -contains 'Toolbox.dmg' -and $names -contains 'Toolbox-Setup.exe' -and $names -contains 'latest.yml') {
              Write-Host "Alle Release-Assets vorhanden: Toolbox.dmg, Toolbox-Setup.exe, latest.yml"
              exit 0
            }
            if ($attempt -eq 90) {
              Write-Output "::error::Release $tag enthält nicht alle Assets."
              gh release view $tag --json assets --jq '.assets[] | "\(.name) (\(.state))"'
              exit 1
            }
            Start-Sleep -Seconds 10
          }
