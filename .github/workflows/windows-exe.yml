name: Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the EXE as a GitHub release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Build Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Headless sync smoke test
        run: npm run smoke:sync

      - name: Build installer
        run: npm run dist -- --publish never

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Toolbox-windows
          path: windows/dist/Toolbox-Setup.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          STORE_URL: ${{ vars.STORE_URL }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version

          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = "v$version"
          }

          # The download table sits at the top of the release notes; fill in
          # the repository and tag in the template for it.
          $repo = $env:GITHUB_REPOSITORY
          if (-not $repo) {
            $repo = (gh repo view --json nameWithOwner --jq .nameWithOwner)
          }
          # Both release workflows render the same combined body from the
          # macOS and Windows notes, so either workflow may finish first
          # without the other platform missing.
          $notes = Join-Path $env:RUNNER_TEMP "release-notes.md"
          if ($env:STORE_URL) {
            node ../scripts/render-release-notes.js --repo $repo --tag $tag --out $notes --store-url $env:STORE_URL
          } else {
            node ../scripts/render-release-notes.js --repo $repo --tag $tag --out $notes
          }
          if ($LASTEXITCODE -ne 0) {
            throw "The release notes could not be generated."
          }

          $title = "Toolbox $version"
          $releaseReady = $false
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            gh release view $tag *> $null
            if ($LASTEXITCODE -eq 0) { $releaseReady = $true; break }
            gh release create $tag --title $title --notes-file $notes *> $null
            if ($LASTEXITCODE -eq 0) { $releaseReady = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $releaseReady) {
            throw "Release $tag could not be created."
          }

          # electron-updater needs latest.yml and the blockmap for auto updates.
          $assets = @(
            "dist/Toolbox-Setup.exe",
            "dist/Toolbox-Setup.exe.blockmap",
            "dist/latest.yml"
          )

          for ($attempt = 1; $attempt -le 5; $attempt++) {
            gh release upload $tag $assets --clobber
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 5) { exit 1 }
            Start-Sleep -Seconds 4
          }

          # Set the complete body again after the upload. Both workflows
          # produce the same text, so the order does not matter.
          $notesUpdated = $false
          for ($attempt = 1; $attempt -le 10; $attempt++) {
            gh release edit $tag --notes-file $notes
            if ($LASTEXITCODE -eq 0) { $notesUpdated = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $notesUpdated) {
            throw "The release notes could not be updated."
          }

      - name: Verify release assets
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version

          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = "v$version"
          }

          for ($attempt = 1; $attempt -le 90; $attempt++) {
            $names = @(gh release view $tag --json assets --jq '.assets[] | select(.state == "uploaded") | .name' 2>$null)
            if ($names -contains 'Toolbox.dmg' -and $names -contains 'Toolbox-Setup.exe' -and $names -contains 'latest.yml') {
              Write-Host "All release assets present: Toolbox.dmg, Toolbox-Setup.exe, latest.yml"
              exit 0
            }
            if ($attempt -eq 90) {
              Write-Output "::error::Release $tag does not contain all assets."
              gh release view $tag --json assets --jq '.assets[] | "\(.name) (\(.state))"'
              exit 1
            }
            Start-Sleep -Seconds 10
          }
