name: macOS DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the DMG as a GitHub release"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: macos-dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    name: Build DMG
    runs-on: xcode-27
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Select the newest installed Xcode version
        run: |
          set -euo pipefail
          latest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$latest" ]; then
            sudo xcode-select -s "$latest"
          fi
          xcodebuild -version

      - name: Build DMG
        run: ./scripts/build-dmg.sh

      - name: Upload DMG as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Toolbox-dmg
          path: dist/Toolbox.dmg
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          STORE_URL: ${{ vars.STORE_URL }}
        run: |
          set -euo pipefail

          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "build/dmg/Toolbox.app/Contents/Info.plist")"

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            # Manual run: create or update the release matching the built
            # version. The update check compares this tag.
            tag="v$version"
          fi

          # Both release workflows render the same combined body from the
          # macOS and Windows notes, so either workflow may finish first
          # without the other platform missing.
          repo="${GITHUB_REPOSITORY:-$(gh repo view --json nameWithOwner --jq .nameWithOwner)}"
          notes="$(mktemp)"
          if [ -n "${STORE_URL:-}" ]; then
            node scripts/render-release-notes.js \
              --repo "$repo" --tag "$tag" --out "$notes" --store-url "$STORE_URL"
          else
            node scripts/render-release-notes.js \
              --repo "$repo" --tag "$tag" --out "$notes"
          fi

          # Create the release if the other workflow has not done so yet;
          # then upload the DMG and set the complete body.
          release_ready=false
          for attempt in $(seq 1 30); do
            if gh release view "$tag" > /dev/null 2>&1; then
              release_ready=true
              break
            fi
            if gh release create "$tag" \
              --title "Toolbox $version" \
              --notes-file "$notes" > /dev/null 2>&1; then
              release_ready=true
              break
            fi
            sleep 2
          done
          if [ "$release_ready" != true ]; then
            echo "::error::Release $tag could not be created."
            exit 1
          fi

          uploaded=false
          for attempt in $(seq 1 10); do
            if gh release upload "$tag" dist/Toolbox.dmg --clobber; then
              uploaded=true
              break
            fi
            sleep 3
          done
          if [ "$uploaded" != true ]; then
            echo "::error::The DMG could not be uploaded to release $tag."
            exit 1
          fi

          notes_updated=false
          for attempt in $(seq 1 10); do
            if gh release edit "$tag" --notes-file "$notes"; then
              notes_updated=true
              break
            fi
            sleep 2
          done
          if [ "$notes_updated" != true ]; then
            echo "::error::The release notes could not be updated."
            exit 1
          fi

      - name: Trigger Windows installer for the same release
        if: github.ref_type != 'tag' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run windows-exe.yml --ref "$GITHUB_REF_NAME" -f publish=true

      - name: Verify release assets
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "build/dmg/Toolbox.app/Contents/Info.plist")"

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$version"
          fi

          for attempt in $(seq 1 90); do
            names="$(gh release view "$tag" --json assets --jq '.assets[] | select(.state == "uploaded") | .name' 2>/dev/null || true)"
            if printf '%s\n' "$names" | grep -qx 'Toolbox.dmg' \
              && printf '%s\n' "$names" | grep -qx 'Toolbox-Setup.exe' \
              && printf '%s\n' "$names" | grep -qx 'latest.yml'; then
              echo "All release assets present: Toolbox.dmg, Toolbox-Setup.exe, latest.yml"
              exit 0
            fi
            if [ "$attempt" -eq 90 ]; then
              echo "::error::Release $tag does not contain all assets."
              gh release view "$tag" --json assets --jq '.assets[] | "\(.name) (\(.state))"' || true
              exit 1
            fi
            sleep 10
          done
