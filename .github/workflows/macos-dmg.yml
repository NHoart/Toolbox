name: macOS DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "DMG als GitHub-Release veröffentlichen"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: macos-dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    name: DMG bauen
    runs-on: xcode-27
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Neueste installierte Xcode-Version auswählen
        run: |
          set -euo pipefail
          latest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$latest" ]; then
            sudo xcode-select -s "$latest"
          fi
          xcodebuild -version

      - name: DMG bauen
        run: ./scripts/build-dmg.sh

      - name: DMG als Workflow-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Toolbox-dmg
          path: dist/Toolbox.dmg
          if-no-files-found: error

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "build/dmg/Toolbox.app/Contents/Info.plist")"

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            # Manueller Start: Release passend zur gebauten Version anlegen
            # bzw. aktualisieren. Der Update-Check vergleicht diesen Tag.
            tag="v$version"
          fi

          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/Toolbox.dmg --clobber
          else
            # Der Windows-Workflow kann denselben Release gleichzeitig anlegen.
            if ! gh release create "$tag" dist/Toolbox.dmg \
              --title "Toolbox $version" \
              --notes-file .github/macos-release-notes.md; then
              gh release upload "$tag" dist/Toolbox.dmg --clobber
            fi
          fi

      - name: Windows-Installer für denselben Release anstoßen
        if: github.ref_type != 'tag' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run windows-exe.yml --ref "$GITHUB_REF_NAME" -f publish=true

      - name: Release-Assets prüfen
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "build/dmg/Toolbox.app/Contents/Info.plist")"

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$version"
          fi

          for attempt in $(seq 1 90); do
            names="$(gh release view "$tag" --json assets --jq '.assets[] | select(.state == "uploaded") | .name' 2>/dev/null || true)"
            if printf '%s\n' "$names" | grep -qx 'Toolbox.dmg' \
              && printf '%s\n' "$names" | grep -qx 'Toolbox-Setup.exe'; then
              echo "Beide Release-Assets vorhanden: Toolbox.dmg, Toolbox-Setup.exe"
              exit 0
            fi
            if [ "$attempt" -eq 90 ]; then
              echo "::error::Release $tag enthält nicht beide Assets."
              gh release view "$tag" --json assets --jq '.assets[] | "\(.name) (\(.state))"' || true
              exit 1
            fi
            sleep 10
          done
