name: macOS DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "DMG als GitHub-Release veröffentlichen"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: macos-dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    name: DMG bauen
    runs-on: xcode-27
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Neueste installierte Xcode-Version auswählen
        run: |
          set -euo pipefail
          latest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$latest" ]; then
            sudo xcode-select -s "$latest"
          fi
          xcodebuild -version

      - name: DMG bauen
        run: ./scripts/build-dmg.sh

      - name: DMG als Workflow-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Toolbox-dmg
          path: dist/Toolbox.dmg
          if-no-files-found: error

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          STORE_URL: ${{ vars.STORE_URL }}
        run: |
          set -euo pipefail

          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "build/dmg/Toolbox.app/Contents/Info.plist")"

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            # Manueller Start: Release passend zur gebauten Version anlegen
            # bzw. aktualisieren. Der Update-Check vergleicht diesen Tag.
            tag="v$version"
          fi

          # Beide Release-Workflows rendern denselben kombinierten Body aus
          # macOS- und Windows-Notes. So darf jeder Workflow zuerst fertig
          # werden, ohne dass die jeweils andere Plattform fehlt.
          repo="${GITHUB_REPOSITORY:-$(gh repo view --json nameWithOwner --jq .nameWithOwner)}"
          notes="$(mktemp)"
          if [ -n "${STORE_URL:-}" ]; then
            node scripts/render-release-notes.js \
              --repo "$repo" --tag "$tag" --out "$notes" --store-url "$STORE_URL"
          else
            node scripts/render-release-notes.js \
              --repo "$repo" --tag "$tag" --out "$notes"
          fi

          # Release anlegen, falls es noch nicht vom anderen Workflow erstellt
          # wurde; danach das DMG hochladen und den vollständigen Body setzen.
          release_ready=false
          for attempt in $(seq 1 30); do
            if gh release view "$tag" > /dev/null 2>&1; then
              release_ready=true
              break
            fi
            if gh release create "$tag" \
              --title "Toolbox $version" \
              --notes-file "$notes" > /dev/null 2>&1; then
              release_ready=true
              break
            fi
            sleep 2
          done
          if [ "$release_ready" != true ]; then
            echo "::error::Release $tag konnte nicht angelegt werden."
            exit 1
          fi

          uploaded=false
          for attempt in $(seq 1 10); do
            if gh release upload "$tag" dist/Toolbox.dmg --clobber; then
              uploaded=true
              break
            fi
            sleep 3
          done
          if [ "$uploaded" != true ]; then
            echo "::error::DMG konnte nicht am Release $tag hochgeladen werden."
            exit 1
          fi

          notes_updated=false
          for attempt in $(seq 1 10); do
            if gh release edit "$tag" --notes-file "$notes"; then
              notes_updated=true
              break
            fi
            sleep 2
          done
          if [ "$notes_updated" != true ]; then
            echo "::error::Release-Notes konnten nicht aktualisiert werden."
            exit 1
          fi

      - name: Windows-Installer für denselben Release anstoßen
        if: github.ref_type != 'tag' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run windows-exe.yml --ref "$GITHUB_REF_NAME" -f publish=true

      - name: Release-Assets prüfen
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "build/dmg/Toolbox.app/Contents/Info.plist")"

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$version"
          fi

          for attempt in $(seq 1 90); do
            names="$(gh release view "$tag" --json assets --jq '.assets[] | select(.state == "uploaded") | .name' 2>/dev/null || true)"
            if printf '%s\n' "$names" | grep -qx 'Toolbox.dmg' \
              && printf '%s\n' "$names" | grep -qx 'Toolbox-Setup.exe' \
              && printf '%s\n' "$names" | grep -qx 'latest.yml'; then
              echo "Alle Release-Assets vorhanden: Toolbox.dmg, Toolbox-Setup.exe, latest.yml"
              exit 0
            fi
            if [ "$attempt" -eq 90 ]; then
              echo "::error::Release $tag enthält nicht alle Assets."
              gh release view "$tag" --json assets --jq '.assets[] | "\(.name) (\(.state))"' || true
              exit 1
            fi
            sleep 10
          done
