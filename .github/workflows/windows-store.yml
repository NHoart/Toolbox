name: Microsoft Store (AppX)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      test_build:
        description: "Testbau mit Platzhalter-Identität (nicht im Store einreichbar)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-store-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appx:
    name: AppX bauen
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests
        run: npm test

      - name: Headless-Sync-Smoke-Test
        run: npm run smoke:sync

      - name: Store-Identität prüfen
        id: store
        shell: pwsh
        run: |
          $config = Get-Content store/store.config.json -Raw | ConvertFrom-Json
          $placeholder = (-not $config.identityName) -or $config.identityName.StartsWith('TODO') -or (-not $config.publisher) -or $config.publisher.StartsWith('CN=TODO')
          $testBuild = "${{ inputs.test_build }}" -eq "true"
          if ($placeholder -and -not $testBuild) {
            Write-Host "::warning::Microsoft-Store-Identität noch nicht konfiguriert. Trage windows/store/store.config.json aus Partner Center ein; der AppX-Build wird übersprungen."
            "build=false" >> $env:GITHUB_OUTPUT
          } else {
            "build=true" >> $env:GITHUB_OUTPUT
          }

      - name: Store-Konfiguration prüfen
        env:
          ALLOW_STORE_PLACEHOLDER: ${{ inputs.test_build && '1' || '' }}
        run: npm run dist:store -- --check

      - name: AppX bauen
        if: steps.store.outputs.build == 'true'
        shell: pwsh
        env:
          ALLOW_STORE_PLACEHOLDER: ${{ inputs.test_build && '1' || '' }}
        run: |
          npm run dist:store 2>&1 | Tee-Object -FilePath store-build.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            "### AppX-Build fehlgeschlagen" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Get-Content store-build.log -Tail 120 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            $details = ((Get-Content store-build.log -Tail 12 | Where-Object { $_.Trim() }) -join ' | ') -replace '%', '%25'
            Write-Output "::error title=AppX-Build fehlgeschlagen::$details"
            exit $exitCode
          }

      - name: AppX als Workflow-Artefakt hochladen
        if: steps.store.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.test_build && 'Toolbox-appx-test' || 'Toolbox-appx' }}
          path: |
            windows/dist/*.appx
            windows/dist/*.appxbundle
          if-no-files-found: error
          retention-days: 30
